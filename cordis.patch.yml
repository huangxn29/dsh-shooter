# Bundle patch layer: the row loads this package's main entry as the host half
# (a no-op Cordis plugin); the `dsh.client` declaration in package.json makes
# the web app load ./client.js as the browser half, which registers the left
# sidebar entry and the panel it opens.
#
# The row `name` must be the bare package specifier that equals package.json
# `name`: the client-modules host half resolves the row name, then requires the
# nearest package.json on that path to carry exactly that name before it serves
# the browser bundle. A row name the manifest does not match silently yields no
# client half at all.
- insert:
    - id: dsh-shooter
      name: 'dsh-shooter'
